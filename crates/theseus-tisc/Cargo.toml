[package]
name = "theseus-tisc"
description = "TISC-1 reversible CPU datapath: State type, register addressing, and instruction isos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
z3-crosscheck = []
# Gate memory-heavy / slow integration-test binaries out of the default (fast)
# tier so the per-attempt maestro gate is fast; advisor runs `--features
# heavy-tests` (single-threaded -- concurrent heavy tests OOM) before merge.
heavy-tests = []

[dependencies]
theseus-core = { path = "../theseus-core" }
theseus-netlist = { path = "../theseus-netlist" }
theseus-spice = { path = "../theseus-spice" }
biodivine-lib-bdd = "=0.6.3"
thiserror = { workspace = true }

[dev-dependencies]
theseus-eval = { path = "../theseus-eval" }
theseus-check = { path = "../theseus-check" }
theseus-syntax = { path = "../theseus-syntax" }

[lints]
workspace = true
