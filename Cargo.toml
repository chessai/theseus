[workspace]
resolver = "2"
members = [
  "crates/theseus-syntax",
  "crates/theseus-core",
  "crates/theseus-check",
  "crates/theseus-eval",
  "crates/theseus-netlist",
  "crates/theseus-emit",
  "crates/theseus-verify",
  "crates/theseus-spice",
  "crates/theseus-cli",
  "crates/theseus-tisc",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chessai/theseus"

# Dependency versions are declared here as they are adopted, per ADR-0020.
# The skeleton is deliberately dependency-free so the workspace builds
# before any component lands. Planned (see docs/src/design/crate-map.md):
#
# Dependency versions are declared here as they are adopted, per ADR-0020.
# Planned (see docs/src/design/crate-map.md):
# ariadne-or-codespan (taste call), miette, la-arena, lasso,
# petgraph, indexmap, rustc-hash, pretty, serde, ron, proptest, arbitrary,
# insta, rayon, vcd, clap, tracing, tracing-subscriber, thiserror, camino,
# splr, cadical-or-kissat bindings (via CnfSolver trait, ADR-0020 amended)
[workspace.dependencies]
logos = "0.14"
# Adopted per ADR-0020 (both listed in the planned set): serde for derive-based
# (de)serialization, ron for the characterization-DB / energy-artifact format
# (the artifact contract is literally RON) — replacing hand-rolled RON text.
serde = { version = "1", features = ["derive"] }
ron = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "allow"        # skeleton phase only; flips to "deny" at v0.1 freeze

# The TISC-1 decoder tests (theseus-tisc/tests/decoder.rs) walk
# multi-million-node iso terms through canonicalize/lower/eval/simulate;
# at opt-level 0 that is impractically slow. Optimize just the
# interpreter/lowering crates in dev builds — test code itself stays
# unoptimized for fast iteration.
[profile.dev.package.theseus-core]
opt-level = 2

[profile.dev.package.theseus-eval]
opt-level = 2

[profile.dev.package.theseus-netlist]
opt-level = 2
