name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix flake check --print-build-logs
      - name: ADR citation lint
        run: nix develop --command bash ci/adr-citation-lint.sh

  proofs:
    name: lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build proofs
        # Fresh checkout => no cached project `.lake/build`, so the proof modules
        # always recompile from source (`cache get` only fetches pinned Mathlib
        # oleans). `lake build` also elaborates TheseusProofs/AxiomGuard.lean,
        # which FAILS the build on any sorry/native_decide/stray axiom -- so proof
        # soundness is CI-enforced, not memory-reliant.
        run: |
          nix develop .#proofs --command bash -c '
            cd theseus-proofs && lake exe cache get && lake build
          '
