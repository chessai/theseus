name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix flake check --print-build-logs
      - name: ADR citation lint
        run: nix develop --command bash ci/adr-citation-lint.sh

  proofs:
    name: lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build proofs
        run: |
          nix develop .#proofs --command bash -c '
            cd theseus-proofs && lake exe cache get && lake build
          '
